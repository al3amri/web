<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f2">
  <meta name="description" content="Ahmed's little corner of the internet. Find me on Instagram.">
  <title>Ahmed — aeee.dev</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23234539'/%3E%3Ctext x='15' y='47' fill='%23f7f8f2' font-family='Georgia,serif' font-style='italic' font-size='53'%3Ea%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f7f8f2;
      --ink: #223e33;
      --muted: #667367;
      --line: #d5ddcf;
      --green: #386348;
      --mint: #e4eddb;
      --display: Georgia, 'Times New Roman', serif;
      --sans: 'Segoe UI', Arial, sans-serif;
      --mono: 'Courier New', monospace;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    ::selection { color: var(--paper); background: var(--ink); }
    a { color: inherit; }
    a { -webkit-tap-highlight-color: transparent; }
    a:focus-visible { outline: 2px solid var(--green); outline-offset: 7px; }
    .shell { width: min(1240px, calc(100% - 112px)); min-height: 100svh; margin-inline: auto; display: flex; flex-direction: column; }
    .skip-link { position: fixed; top: 14px; left: 16px; padding: 12px 18px; background: var(--ink); color: white; z-index: 10; transform: translateY(-160%); }
    .skip-link:focus { transform: none; }
    .header { min-height: 114px; display: flex; justify-content: space-between; align-items: center; gap: 24px; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 650; font-size: 23px; letter-spacing: -.8px; min-height: 44px; }
    .brand-flower { width: 27px; height: 27px; }
    .header-note { color: var(--muted); font-size: 12px; letter-spacing: .015em; }
    main { flex: 1; }
    .hero { display: grid; grid-template-columns: 1.15fr 1fr; align-items: center; gap: 62px; padding: 72px 0 69px; }
    .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--muted); font: 11px var(--mono); letter-spacing: .105em; text-transform: uppercase; }
    .tiny-star { width: 14px; height: 14px; }
    .intro { margin: 36px 0 2px; font-size: clamp(24px, 2.6vw, 34px); font-weight: 400; letter-spacing: -.8px; }
    h1 { margin: 0 0 23px -7px; font: 400 clamp(90px, 10.7vw, 154px)/1.08 var(--display); letter-spacing: -.085em; }
    h1 .period { color: #73965d; }
    .description { max-width: 380px; margin: 0; color: var(--muted); font-size: 16px; line-height: 1.8; }
    .find-link { display: inline-flex; align-items: center; gap: 13px; margin-top: 32px; min-height: 44px; text-decoration: none; font-size: 13px; font-weight: 600; }
    .round-arrow { width: 33px; height: 33px; display: grid; place-items: center; border: 1px solid #bdcbb7; border-radius: 50%; transition: background .2s, transform .2s; }
    .round-arrow svg { width: 15px; height: 15px; }
    .find-link:hover .round-arrow { background: var(--mint); transform: translateY(3px); }
    .artwork { margin: 0; position: relative; width: 100%; max-width: 475px; justify-self: end; }
    .art-frame { position: relative; aspect-ratio: 1.06; background: #e8efdf; border: 1px solid #dae4d2; border-radius: 180px 180px 12px 12px; overflow: hidden; }
    .art-svg { display: block; height: 100%; width: 100%; }
    .orbit { transform-origin: 230px 225px; animation: orbit 90s linear infinite; }
    .art-caption { display: flex; justify-content: space-between; gap: 20px; margin-top: 16px; color: var(--muted); font: 10px var(--mono); letter-spacing: .035em; }
    .hello-sticker { position: absolute; right: -18px; top: 20px; display: flex; align-items: center; justify-content: center; width: 91px; height: 91px; border-radius: 50%; background: #f1edbc; border: 5px solid var(--paper); box-shadow: 0 0 0 1px #dcdcc3; transform: rotate(13deg); }
    .hello-sticker span { text-align: center; font-size: 12px; line-height: 1.4; }
    .hello-sticker .mini-spark { font-size: 18px; line-height: 1; margin-bottom: 4px; display: block; }
    .social-section { padding-bottom: 50px; scroll-margin-top: 28px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 23px; }
    .section-heading h2 { margin: 0; font: 11px var(--mono); letter-spacing: .08em; font-weight: 400; text-transform: uppercase; color: var(--muted); }
    .section-heading span { font: 10px var(--mono); color: var(--muted); }
    .social-links { display: grid; grid-template-columns: 1fr; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .social-link { position: relative; display: flex; align-items: center; gap: 17px; padding: 29px 0; text-decoration: none; transition: background .2s; }
    .social-icon { width: 46px; height: 46px; border: 1px solid #d7dfd0; border-radius: 14px; display: grid; place-items: center; flex: 0 0 auto; transition: background .2s, border-color .2s; }
    .social-icon svg { width: 22px; height: 22px; }
    .social-copy { display: flex; flex-direction: column; gap: 6px; }
    .social-title { font-size: 16px; font-weight: 600; letter-spacing: -.3px; }
    .social-detail { font-size: 12px; color: var(--muted); }
    .out-arrow { height: 17px; width: 17px; margin-left: auto; transition: transform .2s; }
    .social-link:hover .social-icon { background: var(--mint); border-color: #b6c9a9; }
    .social-link:hover .out-arrow { transform: translate(3px, -3px); }
    .footer { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 0 0 26px; color: var(--muted); font-size: 11px; }
    .footer-note { display: flex; align-items: center; gap: 9px; }
    .footer-dot { width: 5px; height: 5px; background: #789061; border-radius: 50%; }
    .reveal { animation: appear .75s both; }
    .artwork.reveal { animation-delay: .12s; }
    .social-section.reveal { animation-delay: .22s; }
    @keyframes appear { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @media (min-width: 1500px) { .hero { padding-top: 92px; padding-bottom: 89px; } }
    @media (max-width: 1050px) {
      .shell { width: calc(100% - 72px); }
      .hero { gap: 36px; padding-top: 58px; padding-bottom: 54px; }
      h1 { font-size: clamp(90px, 11.4vw, 134px); }
      .social-link { gap: 12px; }
      .social-icon { width: 40px; height: 40px; border-radius: 12px; }
    }
    @media (max-width: 760px) {
      .shell { width: calc(100% - 44px); }
      .header { min-height: 86px; }
      .header-note { display: none; }
      .brand { font-size: 22px; }
      .hero { grid-template-columns: 1fr; gap: 42px; padding: 43px 0 43px; }
      .eyebrow { font-size: 10px; }
      .intro { margin-top: 27px; font-size: 27px; }
      h1 { font-size: clamp(82px, 17.5vw, 130px); margin-left: -4px; margin-bottom: 18px; }
      .description { font-size: 15px; max-width: 350px; }
      .find-link { margin-top: 20px; }
      .artwork { width: min(100% - 18px, 390px); justify-self: center; }
      .art-frame { aspect-ratio: 1.2; }
      .hello-sticker { right: -13px; top: 10px; width: 79px; height: 79px; }
      .hello-sticker span { font-size: 11px; }
      .art-caption { font-size: 9px; margin-top: 13px; }
      .social-section { padding-bottom: 34px; }
      .section-heading { margin-bottom: 18px; }
      .social-link { padding: 22px 3px; gap: 15px; }
      .social-icon { width: 44px; height: 44px; }
      .social-title { font-size: 16px; }
      .footer { padding-bottom: 24px; gap: 12px; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <header class="header">
      <a class="brand" href="#" aria-label="aeee.dev home">
        <svg class="brand-flower" viewBox="0 0 32 32" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M16 4v24M4 16h24M7.5 7.5l17 17M7.5 24.5l17-17"/></g><circle cx="16" cy="16" r="4" fill="var(--paper)"/></svg>
        aeee.dev
      </a>
      <span class="header-note">A small space on the internet.</span>
    </header>

    <main id="main">
      <section class="hero" aria-labelledby="name">
        <div class="hero-copy reveal">
          <div class="eyebrow"><svg class="tiny-star" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="m8 0 1.8 6.2L16 8l-6.2 1.8L8 16l-1.8-6.2L0 8l6.2-1.8z"/></svg> A little introduction</div>
          <p class="intro">Hello, I'm</p>
          <h1 id="name">Ahmed<span class="period">.</span></h1>
          <p class="description">Welcome to my corner of the internet.<br>A little space to say hello and stay connected.</p>
          <a class="find-link" href="#links">Find me online <span class="round-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 5v14m-5-5 5 5 5-5"/></svg></span></a>
        </div>

        <figure class="artwork reveal" aria-label="An illustrated letter a surrounded by green orbital lines">
          <div class="art-frame">
            <svg class="art-svg" viewBox="0 0 460 434" fill="none" aria-hidden="true">
              <defs>
                <radialGradient id="orb-fill" cx=".32" cy=".28" r=".8"><stop stop-color="#d7e5c6"/><stop offset="1" stop-color="#b5cda4"/></radialGradient>
                <clipPath id="orb-clip"><circle cx="230" cy="225" r="151"/></clipPath>
              </defs>
              <path d="M230 26v378M40 225h380" stroke="#cadaC2" stroke-dasharray="2 6"/>
              <circle cx="230" cy="225" r="178" stroke="#d3dfca"/>
              <circle cx="230" cy="225" r="151" fill="url(#orb-fill)" stroke="#8ca97d" stroke-width=".8"/>
              <g clip-path="url(#orb-clip)" stroke="#6c8f5b" stroke-width=".7" opacity=".6">
                <ellipse cx="230" cy="225" rx="126" ry="151"/><ellipse cx="230" cy="225" rx="88" ry="151"/><ellipse cx="230" cy="225" rx="44" ry="151"/><path d="M230 74v302"/>
                <ellipse cx="230" cy="225" rx="151" ry="113"/><ellipse cx="230" cy="225" rx="151" ry="68"/><ellipse cx="230" cy="225" rx="151" ry="23"/>
              </g>
              <g transform="rotate(-28 230 225)"><ellipse cx="230" cy="225" rx="204" ry="51" stroke="#45663b" stroke-width="1"/><path d="M26 225a204 51 0 0 0 408 0" stroke="#45663b" stroke-width="1.4"/></g>
              <text x="215" y="292" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="240" letter-spacing="-24" fill="#294c38">a</text>
              <circle cx="283" cy="287" r="10" fill="#f7f8f2"/>
              <g class="orbit"><circle cx="55" cy="138" r="7" fill="#45663b" stroke="#e8efdf" stroke-width="3"/></g>
              <path d="m372 79 3.3 11.7L387 94l-11.7 3.3L372 109l-3.3-11.7L357 94l11.7-3.3z" fill="#5c7850"/>
              <path d="m87 334 2.3 7.7L97 344l-7.7 2.3L87 354l-2.3-7.7L77 344l7.7-2.3z" fill="#5c7850"/>
              <circle cx="364" cy="351" r="3" fill="#8da27a"/>
              <text x="26" y="411" font-family="Courier New,monospace" font-size="9" letter-spacing="1.5" fill="#617951">IN MY OWN ORBIT</text>
              <path d="M410 401v13m-6.5-6.5h13" stroke="#617951"/>
            </svg>
          </div>
          <div class="hello-sticker" aria-hidden="true"><span><span class="mini-spark">✳</span>nice to<br>meet you</span></div>
          <figcaption class="art-caption"><span>A little piece of my world.</span><span>001 — A</span></figcaption>
        </figure>
      </section>

      <section class="social-section reveal" id="links" aria-labelledby="links-heading">
        <div class="section-heading"><h2 id="links-heading">Elsewhere on the internet</h2><span>LET'S CONNECT ↗</span></div>
        <div class="social-links">
          <a class="social-link" href="https://instagram.com/5g7" target="_blank" rel="noopener noreferrer" aria-label="Instagram, @5g7 (opens in a new tab)">
            <span class="social-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></span>
            <span class="social-copy"><span class="social-title">Instagram</span><span class="social-detail">@5g7</span></span>
            <svg class="out-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg>
          </a>
        </div>
      </section>
    </main>

    <footer class="footer"><span>© <span id="year">2026</span> Ahmed</span><span class="footer-note"><span class="footer-dot" aria-hidden="true"></span>Thanks for stopping by.</span></footer>
  </div>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
